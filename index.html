<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inn-Keeper - Finalizar Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menu Superior -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏨 Inn-Keeper</a>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Confirmar Reserva de Hospedagem</h4>
            </div>
            <div class="card-body">
                <form>
                    <!-- Identificação do Cliente -->
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF do Hóspede</label>
                        <input type="text" class="form-field form-control" id="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <!-- Quarto Selecionado (Apenas Leitura por enquanto) -->
                    <div class="mb-3">
                        <label class="form-label">Acomodação</label>
                        <input type="text" class="form-control" value="Suíte Standard - R$ 150/noite" readonly>
                    </div>

                    <!-- Datas de Check-in e Check-out -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="checkin" class="form-label">Data de Check-in</label>
                            <input type="date" class="form-control" id="checkin" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="checkout" class="form-label">Data de Check-out</label>
                            <input type="date" class="form-control" id="checkout" required>
                        </div>
                    </div>

                    <!-- Botões -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="button" class="btn btn-success btn-lg">Confirmar Reserva</button>
                        <a href="index.html" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
