    <!doctype html>
<html lang="pt-BR" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inn-Keeper - Cadastro de Usuário</title>

    <!-- CSS do Bootstrap via CDN (Corrige o visual que estava quebrado) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos do exemplo adaptados -->
    <style>
      html, body {
        height: 100%;
      }
      .form-signin {
        max-width: 400px;
        padding: 1rem;
      }
      .form-signin .form-floating:focus-within {
        z-index: 2;
      }
      /* Arredonda as bordas dos campos para ficarem juntinhos como no exemplo */
      .input-top {
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
      }
      .input-middle {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
        margin-top: -1px;
      }
      .input-bottom {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
        margin-top: -1px;
      }
    </style>
  </head>
  <body class="d-flex align-items-center py-4 bg-body-tertiary">
    
    <main class="form-signin w-100 m-auto text-center">
      <!-- Formulário com método POST enviando para o Python -->
      <form action="/cadastrar" method="POST">
        
        <!-- Ícone do Hotel -->
        <i class="bi bi-luggage text-primary display-4 mb-2"></i>
        <h1 class="h3 mb-3 fw-normal">Criar Conta</h1>

        <!-- Campo NOME -->
        <div class="form-floating">
          <input type="text" class="form-control input-top" id="nome" name="nome" placeholder="Nome Completo" required />
          <label for="nome"><i class="bi bi-person"></i> Nome Completo</label>
        </div>

        <!-- Campo CPF -->
        <div class="form-floating">
          <input type="text" class="form-control input-middle" id="cpf" name="cpf" maxlength="11" placeholder="CPF" required />
          <label for="cpf"><i class="bi bi-card-heading"></i> CPF (apenas números)</label>
        </div>

        <!-- Campo USUÁRIO / LOGIN -->
        <div class="form-floating">
          <input type="text" class="form-control input-middle" id="login" name="login" placeholder="Usuário" required />
          <label for="login"><i class="bi bi-person-vcard"></i> Nickname</label>
        </div>

        <!-- Campo SENHA -->
        <div class="form-floating mb-3">
          <input type="password" class="form-control input-bottom" id="senha" name="senha" minlength="5" placeholder="Senha" required />
          <label for="senha"><i class="bi bi-lock"></i> Senha (min. 5 chars)</label>
        </div>

        <!-- Botão de Envio -->
        <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">
          <i class="bi bi-check-lg"></i> Cadastrar
        </button>

        <div class="mt-3">
          <a href="index.html" class="text-decoration-none small">Voltar para a página inicial</a>
        </div>

        <p class="mt-4 mb-3 text-body-secondary">&copy; Inn-Keeper 2026</p>
      </form>
    </main>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
