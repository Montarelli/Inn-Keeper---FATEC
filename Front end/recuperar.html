<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inn-Keeper - Recuperar Senha</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Bootstrap Icons via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos Customizados (Padrão Booking/Decolar) -->
    <style>
      :root {
        --bs-primary: #ff9f43; /* Laranja da marca */
        --bs-primary-hover: #ff8c1a;
      }

      html, body {
        height: 100%;
        background-color: #f8f9fa; /* Fundo cinza claro */
      }
      
      body {
        display: flex;
        align-items: center;
        padding-top: 40px;
        padding-bottom: 40px;
      }

      /* Card Centralizado */
      .form-signin {
        max-width: 400px;
        padding: 2.5rem 2rem;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      }

      .btn-primary {
        background-color: var(--bs-primary);
        border-color: var(--bs-primary);
        color: #fff;
      }
      
      .btn-primary:hover {
        background-color: var(--bs-primary-hover);
        border-color: var(--bs-primary-hover);
        color: #fff;
      }

      .text-primary {
        color: var(--bs-primary) !important;
      }

      /* Efeito quando clica no campo */
      .form-control:focus {
        border-color: var(--bs-primary);
        box-shadow: 0 0 0 0.25rem rgba(255, 159, 67, 0.25);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    
    <main class="form-signin w-100 m-auto text-center">
      <!-- Formulário apontando para a rota de geração de código -->
      <form action="/gerar-codigo" method="POST">
        
        <!-- Logo e Título -->
        <a href="inicial.html" class="text-decoration-none">
          <i class="bi bi-shield-lock-fill text-primary display-4 mb-2"></i>
        </a>
        <h1 class="h4 mb-2 fw-bold text-dark">Recuperar Senha</h1>
        <p class="text-muted small mb-4">Digite o e-mail cadastrado e enviaremos um código de acesso temporário.</p>

        <!-- Campo EMAIL -->
        <div class="form-floating mb-4">
          <input type="email" class="form-control" id="floatingEmail" name="email" placeholder="nome@exemplo.com" required />
          <label for="floatingEmail" class="text-muted"><i class="bi bi-envelope me-1"></i> E-mail cadastrado</label>
        </div>

        <!-- Botão de Envio -->
        <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill shadow-sm" type="submit">
          Enviar código de acesso
        </button>

        <!-- Links de Navegação -->
        <div class="mt-4">
          <a href="login.html" class="text-decoration-none small text-muted">
            <i class="bi bi-arrow-left"></i> Voltar para o Login
          </a>
        </div>
      </form>
    </main>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
