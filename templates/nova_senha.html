<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inn-Keeper - Nova Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root { --bs-primary: #ff9f43; --bs-primary-hover: #ff8c1a; }
      body { display: flex; align-items: center; padding-top: 40px; padding-bottom: 40px; background-color: #f8f9fa; height: 100vh;}
      .form-signin { max-width: 400px; padding: 2.5rem 2rem; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
      .btn-primary { background-color: var(--bs-primary); border-color: var(--bs-primary); color: #fff; }
      .btn-primary:hover { background-color: var(--bs-primary-hover); border-color: var(--bs-primary-hover); color: #fff; }
    </style>
  </head>
  <body>
    <main class="form-signin w-100 m-auto text-center">
      <form action="/nova-senha" method="POST">
        <h1 class="h4 mb-2 fw-bold text-dark">Definir Nova Senha</h1>
        <p class="text-muted small mb-4">Insira o código recebido por e-mail e sua nova senha.</p>

        {% if erro %}
          <div class="alert alert-danger p-2 small mb-3">{{ erro }}</div>
        {% endif %}

        {% if token_teste %}
          <div class="alert alert-warning p-2 small mb-3">
            <strong>[MODO DESENVOLVIMENTO]</strong><br>
            Seu código é: <strong>{{ token_teste }}</strong>
          </div>
        {% endif %}

        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="token" name="token" placeholder="Código" required>
          <label for="token">Código de 6 letras</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="senha" name="senha" placeholder="Nova Senha" required>
          <label for="senha">Nova Senha (mín. 5 char)</label>
        </div>
        
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar Senha" required>
          <label for="confirmar_senha">Confirmar Senha</label>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill" type="submit">Salvar Nova Senha</button>
      </form>
    </main>
  </body>
</html>
